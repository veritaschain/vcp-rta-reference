name: Verifier regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifier-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13.5']
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install direct test dependencies
        run: python -m pip install -r requirements-verifier-test.txt
      - name: Run all checks and record results
        id: regression
        run: python tools/verifier/run_regression.py --output-dir "${{ runner.temp }}/vcp-regression"
      - name: Diagnose synthetic timestamp failures without changing verdicts
        if: failure() && steps.regression.outcome == 'failure'
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path
          sys.path.insert(0, str(Path('tests').resolve()))
          import test_attested_batch as tests
          with tempfile.TemporaryDirectory(prefix='vcp-ci-diagnostic-') as directory:
              class Factory:
                  def mktemp(self, name):
                      path = Path(directory) / name
                      path.mkdir()
                      return path
              tsa = tests.tsa.__wrapped__(Factory())
              batch = tests.fixture_batch()
              data = tests.extension.anchor_bytes(batch.envelope)
              response = tsa.issue(data)
              real_run = tests.extension.subprocess.run
              def observed_run(command, **kwargs):
                  result = real_run(command, **kwargs)
                  if command[1:3] == ['ts', '-verify']:
                      print('Synthetic OpenSSL verification exit:', result.returncode)
                      print('stderr:', result.stderr.decode(errors='replace')[:4096])
                  return result
              tests.extension.subprocess.run = observed_run
              print(tests.extension.verify_rfc3161(data, response, tsa.ca, tests.POLICY_OID))
          PY
      - name: Retain regression reports, not temporary TSA keys
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verifier-regression-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/vcp-regression/run.json
            ${{ runner.temp }}/vcp-regression/pytest.log
            ${{ runner.temp }}/vcp-regression/junit.xml
            ${{ runner.temp }}/vcp-regression/artifacts.sha256.json
          if-no-files-found: warn
          retention-days: 30
